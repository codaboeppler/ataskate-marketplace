<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ataskate POS — Inventario</title>
<meta name="description" content="Ataskate POS (Operativo): inventario de la sucursal, comercial y prendario, con filtros, multi selección y acciones por artículo." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../ds/primitives.css" />
<link rel="stylesheet" href="../ds/semantic.css" />
<link rel="stylesheet" href="../ds/elevation.css" />
<link rel="stylesheet" href="../ds/base.css" />
<link rel="stylesheet" href="../ds/components.css" />
<link rel="stylesheet" href="../pos.css?v=ux54" />
<link rel="stylesheet" href="inventario.css?v=19" />
</head>
<body class="pos inv">
<header class="pos-header">
  <div class="pos-header__menu">
    <button class="pos-hbtn pos-hbtn--plain pos-menu" type="button" aria-label="Menú">
      <img src="../assets/menu.svg" width="24" height="24" alt="" />
    </button>
    <a class="pos-brand" href="./" aria-label="Ataskate · Operativo">
      <img class="pos-brand__logo" src="../assets/logo-ataskate.svg" alt="ataskate" />
      <span class="pos-brand__role">Operativo</span>
    </a>
  </div>

  <form class="pos-search" role="search" onsubmit="return false">
    <input class="pos-search__input" type="search" placeholder="Buscar" aria-label="Buscar en el inventario" />
    <button class="pos-search__go" type="submit" aria-label="Buscar"><img src="../assets/search.svg" width="24" height="24" alt="" /></button>
  </form>

  <div class="pos-header__ctas">
    <button class="pos-hbtn pos-hide-sm" type="button" aria-label="Notificaciones">
      <img src="../assets/notification.svg" width="24" height="24" alt="" />
    </button>
    <button class="pos-hbtn pos-hide-xs" type="button" id="posCaja" aria-label="Flujo de fondos · caja abierta" aria-haspopup="dialog" aria-expanded="false" aria-controls="posCajaPanel">
      <img src="../assets/pos-terminal.svg" width="24" height="24" alt="" />
      <span class="pos-hbtn__status" aria-hidden="true"></span>
    </button>
    <button class="pos-hbtn pos-hide-sm" type="button" id="posAjustes" aria-label="Configuración" aria-haspopup="menu" aria-expanded="false" aria-controls="posAjustesMenu">
      <img src="../assets/settings.svg" width="24" height="24" alt="" />
    </button>
    <button class="pos-hbtn pos-cart" type="button" id="posCart" aria-label="Carrito, 0 artículos">
      <img src="../assets/cart.svg" width="24" height="24" alt="" />
      <span id="posCartN">0</span>
    </button>
    <button class="pos-hbtn pos-profile" type="button" aria-label="RP · Cambiar de usuario">
      <span class="ds-avatar">RP</span>
      <img src="../assets/sync.svg" width="24" height="24" alt="" />
    </button>
  </div>
</header>

<!-- paneles del Header (HU-CE-595-F / 573-F): se anclan bajo la barra; los abre y cierra ../navbar.js -->
<div class="pos-navpanel pos-caja" id="posCajaPanel" role="dialog" aria-labelledby="posCajaTitulo" hidden>
  <div class="pos-caja__head">
    <h2 id="posCajaTitulo">Flujo de fondos</h2>
    <button class="ds-btn ds-btn--primary pos-caja__btn" type="button">Cerrar flujo</button>
    <button class="pos-caja__x" type="button" aria-label="Cerrar"><img src="../assets/navbar/close.svg" alt="" /></button>
  </div>
  <dl class="pos-caja__tiles">
    <div class="pos-caja__tile"><dt>Saldo total</dt><dd>$23,218</dd></div>
    <div class="pos-caja__tile"><dt>Ingresos</dt><dd>$23,218</dd></div>
    <div class="pos-caja__tile"><dt>Salidas</dt><dd>$8,038</dd></div>
  </dl>
</div>
<div class="pos-navpanel pos-ajustes" id="posAjustesMenu" role="menu" aria-label="Configuración · sesión de Omar, omar.man@gmail.com" hidden>
  <div class="pos-ajustes__user" role="presentation">
    <img src="../assets/navbar/menu-avatar.png" alt="" />
    <span><b>Omar</b><small>omar.man@gmail.com</small></span>
  </div>
  <button class="pos-ajustes__item pos-ajustes__item--plat" type="button" role="menuitem"><img src="../assets/navbar/menu-admin.png" alt="" />Ir a Administrativo</button>
  <button class="pos-ajustes__item pos-ajustes__item--fila" type="button" role="menuitem"><img src="../assets/sync.svg" alt="" />Sucursal Polanco</button>
  <button class="pos-ajustes__item pos-ajustes__item--fila" type="button" role="menuitem"><img src="../assets/navbar/logout.svg" alt="" />Cerrar sesión</button>
</div>


<!-- Inventario (Figma "Casa de empeño (Dev)" · Entregable 13 · HU-CE-571 Comercial y HU-CE-572 Prendario) -->
<main class="pos-main inv-main" id="invMain">
  <!-- Breadcrumb del DS (el mismo de la ficha del artículo) -->
  <nav aria-label="Breadcrumb" class="ds-breadcrumb">
    <ol class="pos-crumbs">
      <li><a href="#" class="ds-breadcrumb__link">Home</a><span class="ds-breadcrumb__sep" aria-hidden="true"><img class="pos-crumb-sep" src="../assets/ds/ArrowForwardIos-D4D6D8.svg" alt="" /></span></li>
      <li><span class="ds-breadcrumb__current" aria-current="page">Inventario</span></li>
    </ol>
  </nav>
  <div class="inv-head">
    <h1 class="inv-title">Inventario</h1>
    <!-- importar / exportar: botones Secondary del DS con iconos action/upload y action/download -->
    <div class="inv-head__actions">
      <button class="ds-btn ds-btn--secondary ds-btn--md inv-io" type="button" id="invImportar"><span class="inv-ico inv-ico--20" data-ico="upload"></span>Importar</button>
      <button class="ds-btn ds-btn--secondary ds-btn--md inv-io" type="button" id="invExportar"><span class="inv-ico inv-ico--20" data-ico="download"></span>Exportar</button>
      <input type="file" id="invArchivo" accept=".csv,text/csv,.xlsx,.xls" hidden />
    </div>
  </div>

  <div class="inv-body" id="invBody">
    <aside class="inv-filters" id="invFilters" aria-labelledby="invFiltersTitle">
      <div class="inv-filters__head">
        <h2 class="inv-filters__title" id="invFiltersTitle">Filtros<span class="inv-badge" id="invFiltersN" hidden></span></h2>
        <button class="inv-fclose" type="button" id="invOcultarFiltros" aria-controls="invFilters" aria-expanded="true" aria-label="Ocultar filtros" title="Ocultar filtros"><span class="inv-ico inv-ico--20" data-ico="panelClose"></span></button>
      </div>
      <div class="inv-filters__inner" id="invFiltersInner"></div>
    </aside>

    <section class="inv-results" aria-label="Artículos">
      <!-- barra del buscador: arriba de los artículos, al lado del panel de Filtros -->
    <section class="inv-toolbar" aria-label="Buscar y vista">
      <!-- Search field V2 del DS de Figma ("Buscador" · variante con filtro y botón): selector a la izquierda, campo y botón morado.
           El selector conserva las opciones del DS de QA: Artículo / Contrato / Cliente -->
      <form class="inv-sf" role="search" id="invSearch">
        <button class="inv-sf__select" type="button" id="invByBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="invByMenu" aria-label="Buscar por: Artículo"><span id="invByLbl">Artículo</span><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M7 10L12 15L17 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <input class="inv-sf__input" id="invQ" type="text" placeholder="Buscar" aria-label="Buscar en el inventario" autocomplete="off"
          role="combobox" aria-autocomplete="list" aria-controls="invSugs" aria-expanded="false" />
        <button class="inv-sf__go" type="submit" id="invGo" aria-label="Buscar"><span class="inv-ico inv-ico--24" data-ico="search"></span></button>
        <div class="inv-sf__menu" id="invByMenu" role="listbox" aria-label="Buscar por" hidden></div>
        <div class="inv-sf__list" id="invSugs" role="listbox" aria-label="Resultados" hidden></div>
      </form>

      <div class="inv-toolbar__right">
        <div class="inv-switch">
          <span id="invMultiLbl">Multi selección</span>
          <button class="inv-switch__track" type="button" role="switch" id="invMulti" aria-checked="false" aria-labelledby="invMultiLbl"><span class="inv-switch__dot"></span></button>
        </div>
        <div class="inv-view" role="group" aria-label="Vista del inventario">
          <button class="inv-view__btn" type="button" id="invVistaGrid" aria-pressed="true" aria-label="Ver en tarjetas"><span class="inv-ico inv-ico--20" data-ico="grid"></span></button>
          <button class="inv-view__btn" type="button" id="invVistaLista" aria-pressed="false" aria-label="Ver en lista"><span class="inv-ico inv-ico--20" data-ico="list"></span></button>
        </div>
      </div>
    </section>
      <!-- encabezado de resultados: cuántos hay y, solo si hay filtros activos, cuáles son -->
      <div class="inv-bar">
        <div class="inv-sort" id="invSort">
          <button class="inv-sort__btn" type="button" id="invSortBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="invSortMenu"><span id="invSortLbl">Ordenar por</span><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M7 10L12 15L17 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <div class="inv-sort__menu" id="invSortMenu" role="listbox" aria-label="Ordenar por" hidden></div>
        </div>
        <button class="inv-fopen" type="button" id="invMostrarFiltros" aria-controls="invFilters" aria-expanded="false" title="Mostrar filtros" hidden><span class="inv-ico inv-ico--20" data-ico="sliders"></span>Filtros<span class="inv-badge" id="invFopenN" hidden></span></button>
        <p class="inv-count" id="invCount" aria-live="polite"></p>
        <div class="inv-activos" id="invActivos" hidden>
          <span class="inv-activos__label">Filtrando por:</span>
          <div class="inv-bar__chips" id="invChips"></div>
          <button class="inv-link" type="button" id="invLimpiar"><span class="inv-ico inv-ico--20" data-ico="redo"></span>Limpiar filtros</button>
        </div>
      </div>
      <div class="inv-grid" id="invGrid"></div>
      <div class="inv-empty" id="invEmpty" hidden>
        <img class="inv-empty__img" src="../assets/inventario/vacio.png" width="216" height="216" alt="" />
        <p class="inv-empty__txt" id="invEmptyTxt">No tienes inventario disponible</p>
        <button class="inv-empty__btn" type="button" id="invEmptyBtn">Comienza a empeñar</button>
      </div>
    </section>
  </div>
</main>

<!-- pestañas de sesión al pie (Figma: Top Container · "Ventana principal" + "+") -->
<nav class="inv-sessions" aria-label="Sesiones de trabajo">
  <span class="inv-sessions__tab is-active" aria-current="page">Ventana principal<span class="inv-ico inv-ico--20 inv-sessions__help" data-ico="help" title="Cada pestaña es una sesión de trabajo con su propio carrito"></span></span>
  <button class="inv-sessions__add" type="button" aria-label="Abrir otra sesión" title="Abrir otra sesión"><span class="inv-ico inv-ico--20" data-ico="add"></span></button>
</nav>

<div class="inv-menu inv-menu--card" id="invCardMenu" role="menu" hidden></div>
<div class="ds-toast-region" id="posToasts" role="region" aria-live="polite"></div>

<script src="inventario.js?v=10"></script>
<script src="../navbar.js?v=3"></script>
<script src="../demo.js?v=6"></script>
<script src="../comentarios.js?v=5"></script>
</body>
</html>
