<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 388" width="200" height="388">
  <!-- LEFT scenery strip: matched to hero-bg.png's left edge column —
       sky #ebe7fd to 29%, foliage from there lightening downward
       (#ccb4fd -> #dbc9fd), white ground from 71%.
       Both vertical edges are identical, so it tiles seamlessly and butts
       invisibly into the artwork. -->
  <defs>
    <linearGradient id="floorL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbc9fd" stop-opacity="0"/>
      <stop offset=".5" stop-color="#dbc9fd"/>
      <stop offset="1" stop-color="#dbc9fd"/>
    </linearGradient>
  </defs>

  <rect width="200" height="388" fill="#ebe7fd"/>
  <path d="M0 118c18-16 34-14 52-2s30 6 48-6 34-10 52 2 30 14 48 6v22H0Z" fill="#e3dafd"/>

  <!-- rounded trees, canopies rising into the sky (kept clear of the edges) -->
  <g fill="#c3a8fd">
    <rect x="56" y="148" width="7" height="130" rx="3.5"/>
    <circle cx="59.5" cy="128" r="30"/>
    <circle cx="38" cy="146" r="19"/>
    <circle cx="81" cy="148" r="17"/>
    <rect x="140" y="192" width="5" height="86" rx="2.5"/>
    <circle cx="142.5" cy="178" r="21"/>
    <circle cx="126" cy="190" r="13"/>
    <circle cx="158" cy="191" r="12"/>
  </g>

  <!-- foliage band starts at 29% (y=112), exactly where the artwork's does -->
  <rect y="112" width="200" height="168" fill="#ccb4fd"/>
  <g fill="#ccb4fd">
    <circle cx="20" cy="110" r="15"/><circle cx="44" cy="104" r="21"/>
    <circle cx="72" cy="108" r="17"/><circle cx="100" cy="100" r="24"/>
    <circle cx="128" cy="107" r="18"/><circle cx="152" cy="102" r="22"/>
    <circle cx="176" cy="109" r="16"/>
  </g>
  <rect y="168" width="200" height="112" fill="url(#floorL)"/>

  <!-- white ground from y=275 (71%); the bush halves at x=0 and x=200 join into
       one bush at every tile seam -->
  <g fill="#fefefe">
    <circle cx="0" cy="279" r="13"/><circle cx="200" cy="279" r="13"/>
    <circle cx="20" cy="273" r="14"/><circle cx="180" cy="273" r="14"/>
    <circle cx="44" cy="277" r="11"/><circle cx="156" cy="277" r="11"/>
    <circle cx="88" cy="272" r="14"/><circle cx="112" cy="276" r="10"/>
    <rect y="275" width="200" height="113"/>
  </g>
  <g fill="#e4d6fd" opacity=".8">
    <ellipse cx="62" cy="297" rx="26" ry="5"/>
    <ellipse cx="146" cy="314" rx="22" ry="4"/>
  </g>
</svg>
